name: Pack

# 每次 push 到 main 或手动触发时自动构建、测试并打包 5 个 npm 包 + 3 个 schema。
# 本工作流产出的 tgz 是构建快照（Actions 运行页下载，7 天过期），发布物以 GitHub Release 资产为准（由 release.yml 挂载）。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pack:
    name: build, test & pack (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Pack 5 packages + schemas
        run: |
          mkdir -p dist-assets
          for p in validator cli language-server mcp-server remark-lint-mdlineage; do
            npm pack -w "packages/$p" --pack-destination dist-assets
          done
          cp schemas/diagnostic-codes.json schemas/mdlineage-config.schema.json schemas/mdlineage-v1.schema.json dist-assets/
          ls -la dist-assets
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-mdlineage-packages-${{ github.sha }}
          path: dist-assets/*
          if-no-files-found: error
          retention-days: 7
