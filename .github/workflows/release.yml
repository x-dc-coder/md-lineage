name: Release

on:
  # A GitHub Release is the release lever: npm publish is only ever attempted
  # from here, so a tag is always the provenance subject. Publishing
  # authenticates through npm trusted publishing (OIDC) — see the publish job.
  release:
    types: [published]
  # Manual path for republishing or publishing outside the Release flow.
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (must already exist)
        required: true
        type: string
      skip_publish:
        description: 'Attach assets only: skip npm publish entirely'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

# `id-token: write` powers both npm trusted publishing (OIDC authentication
# against each package's configured trusted publisher) and the Sigstore
# provenance statement that `publishConfig.provenance: true` asks for.
# Without this permission npm fails with EUSAGE.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish (${{ github.event.release.tag_name || inputs.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout (Release ref or dispatched tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Setup Node 22 with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 bundles npm 10.x.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      - name: Install (npm ci)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The npm CLI (11.5.1+) auto-detects the GitHub OIDC environment and
      # authenticates through each package's trusted publisher configuration.
      # A token secret is only the bootstrap fallback for a package that does not
      # exist on the registry yet — trusted publishers can only be configured for
      # packages that already exist, so the very first publish needs a token.
      - name: Report npm authentication mode
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
            echo "::notice::NPM_TOKEN secret present — used as a bootstrap fallback for this publish; remove the secret once all five packages have trusted publishers configured."
          else
            echo "::notice::No NPM_TOKEN secret — publishing relies on npm trusted publishing (OIDC) for all five packages."
          fi

      - name: Publish skipped (assets only)
        if: ${{ inputs.skip_publish == true }}
        run: echo "::notice::skip_publish=true — npm publish skipped on purpose; the pack job still attached the release assets."

      # `npm publish --workspaces` would publish all five packages, but it
      # skips a package whose version already exists on the registry with only
      # a warning, which would let a partially published release pass green.
      # Publishing one package at a time makes that a hard, local failure.
      # Every step runs unless explicitly skipped: a publish that fails is a red
      # run, never a silent green one.
      - name: Publish @mdlineage/validator
        if: ${{ inputs.skip_publish != true }}
        run: npm publish --provenance --access public
        working-directory: packages/validator

      - name: Publish @mdlineage/remark-lint-mdlineage
        if: ${{ inputs.skip_publish != true }}
        run: npm publish --provenance --access public
        working-directory: packages/remark-lint-mdlineage

      - name: Publish @mdlineage/cli
        if: ${{ inputs.skip_publish != true }}
        run: npm publish --provenance --access public
        working-directory: packages/cli

      - name: Publish @mdlineage/language-server
        if: ${{ inputs.skip_publish != true }}
        run: npm publish --provenance --access public
        working-directory: packages/language-server

      - name: Publish @mdlineage/mcp-server
        if: ${{ inputs.skip_publish != true }}
        run: npm publish --provenance --access public
        working-directory: packages/mcp-server

  # 把 5 个 tgz + 3 个 schema 挂到该 Release 的资产里（与 npm publish 相互独立）。
  # `--clobber` 使重跑/补发幂等；版本守卫确保 tag 与 6 个 package.json 版本一致，防止发错版本。
  # 注意：为已发布的 tag 重跑整个工作流时，资产会被覆盖（预期内），而 publish 腿会因 npm 上
  # 版本已存在而失败变红——这是有意的：宁可红，也不要"部分发布"悄悄通过。
  pack:
    name: pack & attach release assets (${{ github.event.release.tag_name || inputs.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout (Release ref or dispatched tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # One tag must describe one version set: the root manifest and all five
      # packages have to agree, or the release would ship a mixed-version set.
      - name: Guard version == tag (all 6 manifests)
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -e
          versions=""
          for f in package.json packages/validator/package.json packages/cli/package.json packages/language-server/package.json packages/mcp-server/package.json packages/remark-lint-mdlineage/package.json; do
            versions="$versions $(node -p "require('./$f').version")"
          done
          unique=$(printf '%s\n' $versions | sort -u | wc -l)
          if [ "$unique" -ne 1 ]; then
            echo "::error::package.json versions disagree:$versions"
            exit 1
          fi
          v=$(printf '%s\n' $versions | head -1)
          if [ "v$v" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package version v$v"
            exit 1
          fi
          echo "version guard OK: $TAG == v$v across all 6 manifests"
      - name: Pack 5 packages + schemas
        run: |
          mkdir -p dist-assets
          for p in validator cli language-server mcp-server remark-lint-mdlineage; do
            npm pack -w "packages/$p" --pack-destination dist-assets
          done
          cp schemas/diagnostic-codes.json schemas/mdlineage-config.schema.json schemas/mdlineage-v1.schema.json dist-assets/
          ls -la dist-assets
      - name: Upload assets to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist-assets/* --clobber
