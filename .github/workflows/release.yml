name: Release

on:
  # A GitHub Release is the release lever: it re-runs the tagged ref's gates
  # (install → build → test) and attaches the distribution assets (7 tgz +
  # 3 schemas) to the Release. npm is not a distribution channel for this
  # project (Issue #1, closed as not planned): users install straight from
  # the Release asset URLs.
  release:
    types: [published]
  # Manual path for re-attaching assets to an existing tag (idempotent).
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to pack and attach (must already exist)
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 把 7 个 tgz + 3 个 schema 挂到该 Release 的资产里。`--clobber` 使重跑/补发幂等；
  # 版本守卫确保 tag 与 8 个 package.json 版本一致，防止发错版本。
  # 发布前该 job 会在 tag 指向的 ref 上完整重跑 install → build → test，资产与门禁
  # 同源，杜绝「main 绿、tag 红」的发版。
  pack:
    name: pack & attach release assets (${{ github.event.release.tag_name || inputs.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - name: Checkout (Release ref or dispatched tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # One tag must describe one version set: the root manifest and all seven
      # packages have to agree, or the release would ship a mixed-version set.
      - name: Guard version == tag (all 8 manifests)
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -e
          versions=""
          for f in package.json packages/validator/package.json packages/retrieve/package.json packages/embed-local/package.json packages/cli/package.json packages/language-server/package.json packages/mcp-server/package.json packages/remark-lint-mdlineage/package.json; do
            versions="$versions $(node -p "require('./$f').version")"
          done
          unique=$(printf '%s\n' $versions | sort -u | wc -l)
          if [ "$unique" -ne 1 ]; then
            echo "::error::package.json versions disagree:$versions"
            exit 1
          fi
          v=$(printf '%s\n' $versions | head -1)
          if [ "v$v" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package version v$v"
            exit 1
          fi
          echo "version guard OK: $TAG == v$v across all 8 manifests"
      - name: Pack 7 packages + schemas
        run: |
          mkdir -p dist-assets
          for p in validator retrieve embed-local cli language-server mcp-server remark-lint-mdlineage; do
            npm pack -w "packages/$p" --pack-destination dist-assets
          done
          cp schemas/diagnostic-codes.json schemas/mdlineage-config.schema.json schemas/mdlineage-v1.schema.json dist-assets/
          ls -la dist-assets
      - name: Upload assets to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist-assets/* --clobber
