name: Release

on:
  # A GitHub Release is the release lever: npm publish is only ever attempted
  # from here, so a tag is always the provenance subject.
  release:
    types: [published]
  # Manual path for republishing or publishing outside the Release flow.
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (must already exist)
        required: true
        type: string
      allow_missing_npm_token:
        description: 'Attach assets only: run without NPM_TOKEN instead of failing the publish job'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

# `publishConfig.provenance: true` makes npm attach a Sigstore provenance
# statement, which it can only mint from the GitHub OIDC token this job
# requests. Without `id-token: write`, npm fails with EUSAGE instead.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish (${{ github.event.release.tag_name || inputs.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout (Release ref or dispatched tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Setup Node 22 with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install (npm ci)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # A missing NPM_TOKEN used to leave this job green with every publish step
      # skipped — a "published" Release that shipped nothing to npm. The token is
      # a repository secret, so its absence is invisible in the UI; say it loudly
      # instead. A dispatch that only wants assets re-attached can opt out.
      - name: Verify NPM_TOKEN availability
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN present; npm publish steps will run."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.allow_missing_npm_token }}" != "true" ]; then
            echo "::error::NPM_TOKEN repository secret is not configured, so npm publish cannot run. Re-dispatch with allow_missing_npm_token=true to attach release assets only."
            exit 1
          fi
          echo "::warning::NPM_TOKEN is not configured — npm publish steps are skipped; release assets are still attached by the pack job."

      # `npm publish --workspaces` would publish all five packages, but it
      # skips a package whose version already exists on the registry with only
      # a warning, which would let a partially published release pass green.
      # Publishing one package at a time makes that a hard, local failure.
      - name: Publish @mdlineage/validator
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        working-directory: packages/validator
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @mdlineage/remark-lint-mdlineage
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        working-directory: packages/remark-lint-mdlineage
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @mdlineage/cli
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @mdlineage/language-server
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        working-directory: packages/language-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @mdlineage/mcp-server
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        working-directory: packages/mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 把 5 个 tgz + 3 个 schema 挂到该 Release 的资产里（与 npm publish 相互独立）。
  # `--clobber` 使重跑/补发幂等；版本守卫确保 tag 与 6 个 package.json 版本一致，防止发错版本。
  # 注意：为已发布的 tag 重跑整个工作流时，资产会被覆盖（预期内），而 publish 腿会因 npm 上
  # 版本已存在而失败变红——这是有意的：宁可红，也不要"部分发布"悄悄通过。
  pack:
    name: pack & attach release assets (${{ github.event.release.tag_name || inputs.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout (Release ref or dispatched tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # One tag must describe one version set: the root manifest and all five
      # packages have to agree, or the release would ship a mixed-version set.
      - name: Guard version == tag (all 6 manifests)
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -e
          versions=""
          for f in package.json packages/validator/package.json packages/cli/package.json packages/language-server/package.json packages/mcp-server/package.json packages/remark-lint-mdlineage/package.json; do
            versions="$versions $(node -p "require('./$f').version")"
          done
          unique=$(printf '%s\n' $versions | sort -u | wc -l)
          if [ "$unique" -ne 1 ]; then
            echo "::error::package.json versions disagree:$versions"
            exit 1
          fi
          v=$(printf '%s\n' $versions | head -1)
          if [ "v$v" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package version v$v"
            exit 1
          fi
          echo "version guard OK: $TAG == v$v across all 6 manifests"
      - name: Pack 5 packages + schemas
        run: |
          mkdir -p dist-assets
          for p in validator cli language-server mcp-server remark-lint-mdlineage; do
            npm pack -w "packages/$p" --pack-destination dist-assets
          done
          cp schemas/diagnostic-codes.json schemas/mdlineage-config.schema.json schemas/mdlineage-v1.schema.json dist-assets/
          ls -la dist-assets
      - name: Upload assets to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist-assets/* --clobber
