# mdlineage.config.yaml — the authoritative, non-executable configuration
# (docs/remark-language-server-solution.md §7.1).
#
# Adoption state (2026-09-30): the docs/ tree is the pilot. Every Markdown
# file under docs/ must carry mdlineage front matter; everywhere else
# (README, test fixtures) front matter stays optional until adopted.
#
# `metadata.required: true` plus the layout rules below implement the split:
# the catch-all rule exempts every path, and the docs/** rule re-requires
# front matter — the last matching rule wins.

configVersion: 1

metadata:
  required: true

# Repository-defined genres. Keeps the validator defaults (policy, guide,
# architecture, reference) — the fixtures rely on them — and adds the genres
# this documentation tree actually uses. `archived` marks frozen historical
# records (the round-1 review reports) that are kept for reference but are
# not expected to receive updates.
vocabulary:
  kinds: [policy, guide, architecture, reference, spec, report, plan, vision]
  statuses: [draft, active, deprecated, archived]

layout:
  - match: '**/*.md'
    require:
      frontmatter: optional
  - match: 'docs/**'
    require:
      frontmatter: required

# Freshness governance: an `active` document that goes 180 days without a
# substantive update earns MDL801. Every document carries authored
# `created_at`/`updated_at`, so the Git-clock fallback stays idle in steady
# state; `archived` review records and in-progress `draft` designs are
# outside `staleStatuses` and are never nagged.
lifecycle:
  staleAfterDays: 180
