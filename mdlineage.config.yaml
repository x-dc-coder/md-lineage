# mdlineage.config.yaml — the authoritative, non-executable configuration
# (docs/remark-language-server-solution.md §7.1).
#
# This repository adopts MDLineage incrementally: the docs tree carries no
# mdlineage front matter yet, so metadata is not required. Turning
# `metadata.required` on is a later step, taken file by file; until then
# MDL003 stays off repository-wide and the baseline records any debt that
# lands in the meantime.

configVersion: 1

metadata:
  required: false
