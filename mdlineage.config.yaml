# mdlineage.config.yaml — the authoritative, non-executable configuration
#
# Adoption state (2026-10-01): the docs/ tree follows the universal
# directory specification. Developer-facing documents are organized in
# docs/使用手册/ with Chinese filenames and contents; internal specs,
# project ledgers and reviews are kept under docs/架构设计/, docs/project/
# and docs/reviews/.
#
# `metadata.required: true` plus the layout rules below implement the split:
# the catch-all rule exempts every path, docs/** requires front matter,
# and subdirectories enforce architectural intent contracts.

configVersion: 1

metadata:
  required: true

vocabulary:
  kinds: [policy, guide, architecture, reference, spec, report, plan, vision]
  statuses: [draft, active, deprecated, archived]

layout:
  - match: '**/*.md'
    require:
      frontmatter: optional
  - match: 'docs/**'
    require:
      frontmatter: required
  - match: 'docs/使用手册/**'
    intent:
      description: '面向终端开发者的现行中文使用与配置手册'
      kinds: [guide, reference]
      forbidStatus: [draft]
      maxDepth: 2
  - match: 'docs/架构设计/**'
    intent:
      description: 'System specifications and technical RFCs'
      kinds: [architecture, spec, policy]
      authority: [canonical]
  - match: 'docs/project/**'
    intent:
      description: 'Project planning, ledgers and landscape'
      kinds: [plan, report, vision, reference]
  - match: 'docs/reviews/**'
    intent:
      description: 'Independent model reviews and test reports'
      kinds: [report]
      statuses: [archived]
  # 过程目录，不占用领域插槽。两条规则互不重叠。
  # 平铺由 glob 保证：`*` 不跨目录。maxDepth 的模式最小值是 1。
  - match: 'docs/研读复盘/README.md'
    require:
      authority: supporting
    intent:
      description: '阅读看板：精读状态与篇目索引'
      kinds: [reference]
      authority: [supporting]
      forbidStatus: [draft, archived]
  - match: 'docs/研读复盘/20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*.md'
    require:
      authority: supporting
    intent:
      description: '单次研读实录或专项评测'
      kinds: [report]
      authority: [supporting]
      forbidStatus: [archived]
      maxDepth: 1

lifecycle:
  staleAfterDays: 180
  staleStatuses: [active]
  exempt:
    - 'docs/reviews/**'
